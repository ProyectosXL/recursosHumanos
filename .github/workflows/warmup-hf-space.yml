name: Warm Up HF Space

on:
  schedule:
    # 07:00 America/Argentina/Buenos_Aires = 10:00 UTC
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_SPACE_ID: cfedetrejo/docugest-unified
      HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
      SPACE_HEALTH_URL: https://cfedetrejo-docugest-unified.hf.space/health
      TRIGGER_REFRESH_URL: https://app.xl.com.ar/recursosHumanos/p&p/Controller/trigger_refresh.php
      MAX_ATTEMPTS: "15"
      MAX_INDEX_ATTEMPTS: "15"
      SLEEP_SECONDS: "20"
      REQUEST_TIMEOUT_SECONDS: "25"

    steps:
      - name: Wake up HF Space, wait until healthy, then trigger indexation
        shell: bash
        run: |
          set -u

          # Returns the HTTP code; outputs "000" on network/timeout error via -w format string
          check_health() {
            curl -sS -o /tmp/hf_health.json -w "%{http_code}" \
              --max-time "$REQUEST_TIMEOUT_SECONDS" \
              "$SPACE_HEALTH_URL"
          }

          # ── 1. Initial health check ───────────────────────────────────────────
          echo "Warming up: $SPACE_HEALTH_URL"
          initial_http_code=$(check_health)
          echo "Initial health HTTP: $initial_http_code"

          if [ "$initial_http_code" != "200" ]; then
            # ── 2. Space is asleep — request restart ──────────────────────────
            if [ -z "${HF_API_TOKEN:-}" ]; then
              echo "Missing HF_API_TOKEN secret. Configure it in GitHub repository secrets."
              exit 1
            fi

            restart_url="https://huggingface.co/api/spaces/${HF_SPACE_ID}/restart"
            echo "Requesting restart: $restart_url"

            restart_http_code=$(curl -sS -o /tmp/hf_restart.json -w "%{http_code}" \
              --max-time "$REQUEST_TIMEOUT_SECONDS" \
              -X POST \
              -H "Authorization: Bearer ${HF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{}' \
              "$restart_url")

            echo "Restart HTTP: $restart_http_code"
            if [ "$restart_http_code" -lt 200 ] || [ "$restart_http_code" -ge 300 ]; then
              echo "Restart request failed. HF response snippet:"
              head -c 300 /tmp/hf_restart.json || true
              echo
              exit 1
            fi

            # ── 3. Poll until healthy ─────────────────────────────────────────
            attempt=1
            while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
              echo "Attempt $attempt/$MAX_ATTEMPTS — waiting $SLEEP_SECONDS seconds..."
              sleep "$SLEEP_SECONDS"

              http_code=$(check_health)
              echo "Health HTTP: $http_code"

              if [ "$http_code" = "200" ]; then
                echo "HF Space is awake and healthy."
                break
              fi

              if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
                echo "HF Space did not become healthy in time."
                exit 1
              fi

              attempt=$((attempt + 1))
            done
          fi

          # ── 4. Space is healthy — check if documents are indexed ─────────────
          total_chunks=$(jq -r '.total_chunks // -1' /tmp/hf_health.json 2>/dev/null || echo "-1")
          echo "total_chunks: $total_chunks"

          if [ "$total_chunks" -gt 0 ]; then
            echo "Already indexed ($total_chunks chunks). Nothing to do."
            head -c 300 /tmp/hf_health.json || true
            echo
            exit 0
          fi

          # ── 5. No documents indexed — trigger indexation via PHP endpoint ────
          echo "Space healthy but 0 docs indexed. Triggering indexation..."
          trigger_resp=$(curl -sS -o /tmp/hf_trigger.json -w "%{http_code}" \
            --max-time 30 \
            "$TRIGGER_REFRESH_URL")
          echo "trigger_refresh HTTP: $trigger_resp"
          echo "trigger_refresh response:"
          cat /tmp/hf_trigger.json || true
          echo

          # ── 6. Poll until documents are indexed ───────────────────────────────
          index_attempt=1
          while [ "$index_attempt" -le "$MAX_INDEX_ATTEMPTS" ]; do
            echo "Indexation attempt $index_attempt/$MAX_INDEX_ATTEMPTS — waiting $SLEEP_SECONDS seconds..."
            sleep "$SLEEP_SECONDS"

            http_code=$(check_health)
            total_chunks=$(jq -r '.total_chunks // -1' /tmp/hf_health.json 2>/dev/null || echo "-1")
            echo "Health HTTP: $http_code | total_chunks: $total_chunks"

            if [ "$http_code" = "200" ] && [ "$total_chunks" -gt 0 ]; then
              echo "Indexation complete! total_chunks=$total_chunks"
              head -c 300 /tmp/hf_health.json || true
              echo
              exit 0
            fi

            if [ "$index_attempt" -eq "$MAX_INDEX_ATTEMPTS" ]; then
              echo "Indexation did not complete in time (total_chunks=$total_chunks). Space is awake but documents may still be loading."
              exit 1
            fi

            index_attempt=$((index_attempt + 1))
          done
